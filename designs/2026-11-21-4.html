<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../brand/brand.css"><title>T</title><style>.o{display:flex;align-items:center;gap:20px;padding:22px 26px;border-radius:28px;background:#fff;font-size:28px;line-height:1.25;box-shadow:0 8px 24px rgba(30,42,59,.06)}.l{width:52px;height:52px;border-radius:999px;background:var(--blush);color:var(--clay-dark);font-weight:700;font-size:26px;display:flex;align-items:center;justify-content:center;flex:none}</style></head><body>
