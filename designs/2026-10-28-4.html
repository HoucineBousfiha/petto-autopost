<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../brand/brand.css"><title>T</title><style>.c{background:var(--blush);border-radius:28px;padding:26px 30px;font-size:30px;line-height:1.3}.row{background:rgba(255,255,255,0.09);border-radius:32px;padding:26px 36px;color:#fff;font-size:34px;line-height:1.3;display:flex;gap:28px;align-items:center}.row b{font-size:26px;color:var(--peach);letter-spacing:.04em;width:130px;flex:none}.opt{border-radius:32px;padding:34px 40px;font-size:40px;font-weight:700;display:flex;align-items:center;gap:30px}.opt i{font-style:normal;font-family:"Bricolage Grotesque";font-weight:800;font-size:42px;width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}</style></head><body>
