<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../brand/brand.css"><title>T</title><style>.opt{border-radius:32px;padding:34px 40px;font-size:38px;font-weight:700;display:flex;align-items:center;gap:30px;line-height:1.2}.opt i{font-style:normal;font-family:"Bricolage Grotesque";font-weight:800;font-size:42px;width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}</style></head><body>
<div class="post" style="background:var(--navy);color:#fff;padding:96px 112px;display:flex;flex-direction:column;gap:34px">
<div style="display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:18px"><img class="logo" src="../brand/logo.png" alt="PETTO logo"><span class="wordmark">PETTO</span></div><span class="pill" style="background:rgba(255,255,255,0.12);color:var(--peach)">THIS OR THAT</span></div>
<h1 class="display" style="font-size:88px;margin-top:20px">Pick one, <span style="color:var(--peach)">forever.</span></h1>
<div style="display:flex;flex-direction:column;gap:24px;flex:1;justify-content:center">
<div class="opt" style="background:rgba(255,255,255,0.09)"><i style="background:var(--peach);color:var(--navy)">A</i>Zoomies at midnight</div>
<div class="opt" style="background:rgba(255,255,255,0.09)"><i style="background:var(--peach);color:var(--navy)">B</i>Cuddles at 6 a.m.</div>
<div class="opt" style="background:rgba(255,255,255,0.09)"><i style="background:var(--peach);color:var(--navy)">C</i>Staring at you while you eat</div></div>
<p style="margin:0;font-size:30px;color:rgba(255,255,255,0.8)">Comment A, B or C and tag a pet parent.</p></div></body></html>
