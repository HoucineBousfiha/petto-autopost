<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../brand/brand.css"><title>T</title><style>.row{display:flex;align-items:center;gap:22px;padding:40px 0;border-top:2px solid #F3DED1;font-size:36px}.row:first-of-type{border-top:0}.t{margin-left:auto;color:var(--slate);font-size:28px}.ic{width:56px;height:56px;border-radius:999px;background:var(--blush);display:flex;align-items:center;justify-content:center;flex:none}.st{flex:1;background:var(--cream);border-radius:24px;padding:22px 26px}.st b{font-family:"Bricolage Grotesque";font-weight:800;font-size:48px;display:block}.st span{font-size:22px;color:var(--slate)}</style></head><body>
