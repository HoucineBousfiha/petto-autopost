<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../brand/brand.css">
<title>Example: honest cat review</title>
</head>
<body>
<div class="post" style="background:var(--navy);color:#fff;padding:96px;display:flex;flex-direction:column;gap:48px">
  <div style="display:flex;align-items:center;gap:18px">
    <img class="logo" src="../brand/logo.png" alt="PETTO logo">
    <span class="wordmark" style="color:var(--peach)">PETTO</span>
  </div>
  <h1 class="display" style="font-size:92px">Things your cat is judging you for <span style="color:var(--peach)">today.</span></h1>
  <div style="display:flex;flex-direction:column;gap:18px">
    <div style="padding:26px 30px;border-radius:30px;background:rgba(255,255,255,0.09);font-size:32px">Breakfast was 4 minutes late.</div>
    <div style="padding:26px 30px;border-radius:30px;background:rgba(255,255,255,0.09);font-size:32px">You petted the dog first.</div>
    <div style="padding:26px 30px;border-radius:30px;background:rgba(255,255,255,0.09);font-size:32px">The water bowl is "yesterday's water."</div>
    <div style="padding:26px 30px;border-radius:30px;background:rgba(255,255,255,0.09);font-size:32px">You closed a door. Any door.</div>
  </div>
  <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:center">
    <p style="margin:0;font-size:30px;color:#E9EDF2;max-width:560px">PETTO reminds you before the judging starts.</p>
    <span class="cta">Free on iOS &amp; Android</span>
  </div>
</div>
</body>
</html>
