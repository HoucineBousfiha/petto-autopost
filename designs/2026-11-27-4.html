<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../brand/brand.css"><title>T</title><style>.opt{flex:1;background:#fff;border-radius:32px;padding:44px 36px;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;box-shadow:0 16px 40px rgba(30,42,59,.08)}.opt .l{width:84px;height:84px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:44px}.opt p{margin:0;font-size:32px;font-weight:700;line-height:1.25}.opt small{font-size:24px;color:var(--slate);line-height:1.35}</style></head><body>
<div class="post" style="background:var(--cream);padding:96px 112px;display:flex;flex-direction:column;gap:34px">
<img src="../brand/assets/assistant-chat-bg.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.18;z-index:0">
<div style="position:relative;z-index:1;display:flex;flex-direction:column;gap:34px;height:100%">
<div style="display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:18px"><img class="logo" src="../brand/logo.png" alt="PETTO logo"><span class="wordmark">PETTO</span></div><span class="pill">THIS OR THAT</span></div>
<h1 class="display" style="font-size:86px;margin-top:8px">You bought the fancy gift. They picked <span style="color:var(--clay)">the box.</span></h1>
<div style="flex:1"></div>
<div style="display:flex;gap:28px">
<div class="opt"><div class="l" style="background:var(--blush);color:var(--clay)">A</div><svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#A65F47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1.5S10 8 12 8zM12 8c2-4 6-4 6-1.5S14 8 12 8z"/></svg><p>The fancy new gift</p><small>sniffed once. ignored.</small></div>
<div class="opt"><div class="l" style="background:var(--navy);color:var(--peach)">B</div><svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#1E2A3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-4 9 4v10l-9 3-9-3z"/><path d="M3 9l9 3 9-3M12 12v10"/></svg><p>The box it came in</p><small>best day of their life.</small></div>
</div>
<div style="flex:1"></div>
<p style="margin:0;text-align:center;font-size:30px;color:var(--slate)">Which one wins at your place? <b style="color:var(--navy)">Comment A or B.</b></p>
</div></div></body></html>
