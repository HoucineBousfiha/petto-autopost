<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../brand/brand.css"><title>T</title><style>.row{background:rgba(255,255,255,0.09);border-radius:32px;padding:30px 36px;color:#fff;font-size:34px;line-height:1.3}.row b{display:block;font-size:26px;color:var(--peach);letter-spacing:.05em;margin-bottom:6px}.c{background:var(--blush);border-radius:28px;padding:26px 28px;font-size:29px;line-height:1.3}.opt{background:#fff;border-radius:32px;padding:34px 40px;font-size:40px;font-weight:700;display:flex;align-items:center;gap:30px}.opt i{font-style:normal;font-family:"Bricolage Grotesque";font-weight:800;font-size:44px;width:84px;height:84px;border-radius:50%;background:var(--clay);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}</style></head><body>
<div class="post" style="background:var(--cream);padding:96px 112px;display:flex;flex-direction:column;gap:30px">
<div style="display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:18px"><img class="logo" src="../brand/logo.png" alt="PETTO logo"><span class="wordmark">PETTO</span></div><span class="pill">THIS OR THAT</span></div>

<div style="display:flex;gap:36px;flex:1;min-height:0">
<div style="display:flex;flex-direction:column;gap:22px;flex:1;justify-content:center">

<div class="opt"><i>B</i>On the sofa</div>
<div class="opt"><i>C</i>In my bed</div>
<div class="opt"><i>D</i>On my head</div></div>
<div style="width:330px;flex:none;border-radius:32px;overflow:hidden"><img src="../brand/assets/petto-plus-bg-img.png" alt="Dog and kitten asleep on a blanket" style="width:100%;height:100%;object-fit:cover"></div></div>
<div style="display:flex;justify-content:space-between;align-items:center;gap:24px"><p style="margin:0;font-size:27px;color:var(--slate);max-width:420px">Comment your letter and tag a pet parent.</p><span class="cta">Free on iOS &amp; Android</span></div></div></body></html>
