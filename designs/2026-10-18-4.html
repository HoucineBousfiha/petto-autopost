<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../brand/brand.css">
<title>Engagement: morning or evening walk</title>
<style>
  .opt{flex:1;border-radius:32px;padding:44px 36px;display:flex;flex-direction:column;gap:22px}
  .opt h2{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:56px;letter-spacing:-0.02em;line-height:1}
  .opt p{margin:0;font-size:30px;line-height:1.35}
</style>
</head>
<body>
<div class="post" style="background:var(--cream);padding:96px 112px;display:flex;flex-direction:column;gap:48px">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:18px">
      <img class="logo" src="../brand/logo.png" alt="PETTO logo">
      <span class="wordmark">PETTO</span>
    </div>
    <span class="pill">THIS OR THAT</span>
  </div>
  <h1 class="display" style="font-size:96px">Which walk is your dog's <span style="color:var(--clay)">favourite?</span></h1>
  <div style="display:flex;gap:24px;flex:1">
    <div class="opt" style="background:var(--blush)">
      <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#A65F47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <h2>Morning walk</h2>
      <p>Fresh smells. Empty streets. Every bush has news overnight.</p>
      <span style="margin-top:auto;font-size:30px;font-weight:700;color:var(--clay-dark)">Comment A</span>
    </div>
    <div class="opt" style="background:var(--navy);color:#fff">
      <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#F0A98C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <h2>Evening walk</h2>
      <p style="color:#E9EDF2">Cooler air. More dogs to greet. Zoomies when you get home.</p>
      <span style="margin-top:auto;font-size:30px;font-weight:700;color:var(--peach)">Comment B</span>
    </div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:24px">
    <p style="margin:0;font-size:28px;color:var(--slate);max-width:420px">Either way, PETTO logs it in the walk tracker.</p>
    <span class="cta">Free on iOS &amp; Android</span>
  </div>
</div>
</body>
</html>
