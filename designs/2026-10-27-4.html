<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../brand/brand.css"><title>T</title><style>.c{background:var(--blush);border-radius:28px;padding:26px 30px;font-size:30px;line-height:1.3}.row{background:rgba(255,255,255,0.09);border-radius:32px;padding:28px 36px;color:#fff;font-size:33px;line-height:1.3}.row b{display:block;font-size:24px;color:var(--peach);letter-spacing:.05em;margin-bottom:6px}.opt{border-radius:32px;padding:30px 40px;font-size:38px;font-weight:700;display:flex;align-items:center;gap:30px}.opt i{font-style:normal;font-family:"Bricolage Grotesque";font-weight:800;font-size:42px;width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}</style></head><body>

<div class="opt" style="background:rgba(255,255,255,0.09);color:#fff;font-size:42px;padding:26px 40px"><i style="background:var(--peach);color:var(--navy)">B</i>Only sunset walks</div>
<div class="opt" style="background:rgba(255,255,255,0.09);color:#fff;font-size:42px;padding:26px 40px"><i style="background:var(--peach);color:var(--navy)">C</i>Walks in any weather</div>
<img src="../brand/assets/ai-loading-illustration.png" alt="PETTO robot with pets" style="height:330px;object-fit:contain;margin-top:6px"></div>
<div style="display:flex;justify-content:space-between;align-items:center;gap:24px"><p style="margin:0;font-size:28px;color:rgba(255,255,255,.75);max-width:440px">Comment A, B or C and tag a pet parent.</p><span class="cta">Free on iOS &amp; Android</span></div></div></body></html>
