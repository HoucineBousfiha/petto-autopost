<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../brand/brand.css">
<title>Your Sunday vs your pet's Sunday</title>
<style>
  .stage{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--cream);
    font-family:"DM Sans",sans-serif;color:var(--navy)}
  /* safe zone: 200px top, 420px bottom, 110px sides */
  .scene{position:absolute;inset:0;padding:200px 110px 420px;box-sizing:border-box;display:flex;flex-direction:column;
    justify-content:center;opacity:0}
  .light{background:var(--cream);color:var(--navy)}
  .dark{background:var(--navy);color:#fff}
  h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.03em;line-height:.98;margin:0}
  .light h1 span,.light h2 span{color:var(--clay)}
  .dark h1 span,.dark h2 span{color:var(--peach)}
  .sub{font-size:48px;line-height:1.2;margin:0}
  .light .sub{color:var(--slate)} .dark .sub{color:#C9D1DC}
  .photo{width:860px;border-radius:40px;object-fit:cover;display:block}
  .phone{position:relative;align-self:center;border:14px solid var(--navy);border-radius:60px;overflow:hidden;background:#fff;
    box-shadow:0 40px 80px rgba(30,42,59,.22)}
  .phone img{position:absolute;left:0;width:100%;display:block}
  .endc{align-items:center;text-align:center;gap:44px;background:var(--cream);color:var(--navy)}
  .endc .wordmark{font-size:72px;color:var(--clay)}
  .endc h3{font-size:84px;line-height:1;letter-spacing:-.02em}
  .endc .cta{font-size:44px;padding:30px 56px}
  .endc .lg{width:220px;height:220px;border-radius:52px}
  .endc .lg3d{width:300px;height:300px;object-fit:contain}
  .sE{animation:show .6s 26.5s both}
  .sE img{animation:pop .6s 26.7s both}
  .sE .wordmark{animation:rise .5s 27s both}
  .sE h3{animation:rise .5s 27.2s both}
  .sE .cta{animation:pop .5s 27.6s both}
  @keyframes show{from{opacity:0}to{opacity:1}}
  @keyframes hide{from{opacity:1}to{opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
  @keyframes slideL{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
  @keyframes slideR{from{opacity:0;transform:translateX(80px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  @keyframes zoom{from{transform:scale(1)}to{transform:scale(1.12)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}

  .stage{background:var(--navy)}
  .s1{animation:show 0s 0s both, hide .5s 5.5s forwards}
  .s2{animation:show .5s 5.5s both, hide .5s 21.5s forwards}
  .s3{animation:show .5s 21.5s both, hide .5s 26.5s forwards}
  .s1{gap:56px}
  .s1 h1{font-size:132px;animation:rise .7s .1s both}
  .s1 .sub{animation:rise .6s 2.2s both}
  .vs{display:flex;gap:40px;align-items:center;animation:pop .6s 1.4s both}
  .vs span{font-family:"Bricolage Grotesque";font-weight:800;font-size:56px;padding:16px 40px;border-radius:999px}
  .vs .a{background:var(--blush);color:var(--clay-dark)}.vs .b{background:var(--peach);color:var(--navy)}
  .vs em{font-style:normal;font-size:44px;color:#AEB7C4}
  .s2{gap:26px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:10px;animation:rise .5s 5.8s both}
  .cols span{text-align:center;font-family:"Bricolage Grotesque";font-weight:800;font-size:52px;padding:14px;border-radius:999px}
  .cols .a{background:var(--blush);color:var(--clay-dark)}.cols .b{background:var(--peach);color:var(--navy)}
  .time{font-size:40px;font-weight:700;color:#AEB7C4;text-align:center}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .pair div{padding:30px 28px;border-radius:32px;font-size:42px;line-height:1.18;text-align:center;display:flex;align-items:center;justify-content:center;min-height:110px}
  .pair .y{background:rgba(255,255,255,.09)}.pair .t{background:var(--clay)}
  .p1{animation:rise .5s 6.4s both}.p2{animation:rise .5s 9.8s both}.p3{animation:rise .5s 13.2s both}.p4{animation:rise .5s 16.6s both}
  .s3{gap:48px}
  .s3 h2{font-size:104px;animation:rise .6s 21.8s both}
  .s3 .photo{height:760px;object-position:50% 55%;animation:pop .6s 22.6s both}

</style>
</head>
<body>
<div class="stage">

  <section class="scene dark s1">
    <h1>Your Sunday vs <span>your pet's Sunday</span></h1>
    <div class="vs"><span class="a">You</span><em>vs</em><span class="b">Them</span></div>
    <p class="sub">Spot the difference.</p>
  </section>
  <section class="scene dark s2">
    <div class="cols"><span class="a">You</span><span class="b">Them</span></div>
    <div class="p1"><div class="time">9 AM</div><div class="pair"><div class="y">Laundry</div><div class="t">Nap</div></div></div>
    <div class="p2"><div class="time">12 PM</div><div class="pair"><div class="y">Groceries</div><div class="t">Nap, other side</div></div></div>
    <div class="p3"><div class="time">3 PM</div><div class="pair"><div class="y">Meal prep for the week</div><div class="t">Supervises meal prep</div></div></div>
    <div class="p4"><div class="time">9 PM</div><div class="pair"><div class="y">Sunday scaries</div><div class="t">Zoomies</div></div></div>
  </section>
  <section class="scene light s3">
    <h2>Who's winning?<br><span>Not us.</span></h2>
    <img class="photo" src="../brand/assets/petto-plus-bg-img.png" alt="Golden retriever and kitten asleep together on a blanket">
  </section>

  <section class="scene endc sE">
    <img class="lg" src="../brand/logo.png" alt="PETTO logo">
    <span class="wordmark">PETTO</span>
    <h3>Plan their week. Then nap too.</h3>
    <span class="cta">Free on iOS &amp; Android</span>
  </section>
</div>
</body>
</html>
