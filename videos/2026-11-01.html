<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../brand/brand.css">
<title>Video: the PETTO home screen widget</title>
<style>
  .stage{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:"DM Sans",sans-serif}
  .dark{background:var(--navy);color:#fff}.light{background:var(--cream);color:var(--navy)}
  .scene{position:absolute;inset:0;padding:200px 110px 420px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;opacity:0}
  @keyframes show{from{opacity:0}to{opacity:1}}
  @keyframes hide{from{opacity:1}to{opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
  @keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .h1{font-size:122px;margin:0}
  .dark .acc{color:var(--peach)}.light .acc{color:var(--clay)}
  .sub{font-size:48px;margin:40px 0 0}
  .dark .sub{color:#C9D1DC}.light .sub{color:var(--slate)}
  .paw{width:170px;height:170px;margin-bottom:36px}
  .head{display:flex;align-items:center;gap:22px;margin-bottom:30px}
  .head .av{width:96px;height:96px;border-radius:50%;background:var(--blush);display:flex;align-items:center;justify-content:center}
  .head b{font-size:46px}.head small{display:block;font-size:30px;color:#AEB7C4}
  .msg{align-self:flex-start;max-width:800px;padding:30px 38px;border-radius:40px 40px 40px 12px;margin-bottom:26px;
    background:rgba(255,255,255,.1);font-size:48px;line-height:1.22}
  .msg i{display:block;font-style:normal;font-size:28px;color:#AEB7C4;margin-top:8px}
  .msg.me{align-self:flex-end;border-radius:40px 40px 12px 40px;background:var(--clay);color:#fff}
  .msg.me i{color:#F3DED1}
  .light .msg:not(.me){background:#fff;box-shadow:0 14px 40px rgba(30,42,59,.10)}
  .light .msg i{color:var(--slate)}
  .h2{font-size:100px;margin:0 0 50px}
  .card{display:flex;align-items:center;gap:30px;padding:40px;border-radius:44px;background:var(--clay);color:#fff;
    box-shadow:0 30px 70px rgba(0,0,0,.25)}
  .card img{width:110px;height:110px;border-radius:26px;flex:none}
  .card b{font-size:40px;display:block;margin-bottom:6px}.card span{font-size:44px;line-height:1.15;display:block}
  .check{align-self:center;margin-top:50px;width:140px;height:140px;border-radius:50%;background:var(--sage);
    display:flex;align-items:center;justify-content:center}
  .tip{display:flex;gap:34px;align-items:flex-start;padding:38px 40px;border-radius:40px;background:#fff;
    box-shadow:0 14px 40px rgba(30,42,59,.10);margin-bottom:30px}
  .tip .n{flex:none;width:96px;height:96px;border-radius:50%;background:var(--clay);color:#fff;font-family:"Bricolage Grotesque";
    font-weight:800;font-size:56px;display:flex;align-items:center;justify-content:center}
  .tip b{display:block;font-family:"Bricolage Grotesque";font-weight:800;font-size:58px;line-height:1.02;margin-bottom:10px}
  .tip span{font-size:42px;line-height:1.22;color:var(--slate)}
  .dark .tip{background:rgba(255,255,255,.09);box-shadow:none}
  .dark .tip span{color:#C9D1DC}.dark .tip .n{background:var(--peach);color:var(--navy)}
  .frame{border-radius:44px;overflow:hidden;box-shadow:0 30px 70px rgba(30,42,59,.25);position:relative}
  .frame img{display:block}
  .stars{display:flex;gap:10px;margin:10px 0 18px}
  .rev{padding:44px 48px;border-radius:44px;background:rgba(255,255,255,.09);margin-bottom:34px}
  .rev h4{font-family:"Bricolage Grotesque";font-weight:800;font-size:60px;margin:0 0 4px;letter-spacing:-.02em}
  .rev p{font-size:48px;line-height:1.2;margin:0;color:#E4E9F0}
  .end{align-items:center;text-align:center;gap:44px;background:var(--cream);color:var(--navy)}
  .end img{width:220px;height:220px;border-radius:52px}
  .end .wordmark{font-size:72px;color:var(--clay)}
  .end h3{font-family:"Bricolage Grotesque";font-weight:800;font-size:84px;line-height:1;margin:0;letter-spacing:-.02em}
  .end .cta{font-size:44px;padding:30px 56px}

    .s1{animation:show 0s 0s both, hide .5s 5.5s both}
  .s2{animation:show .5s 5.5s both, hide .5s 21s both}
  .s3{animation:show .5s 21s both, hide .5s 26s both}
  .s4{animation:show .6s 26s both}
</style>
</head>
<body>
<div class="stage light">
  <section class="scene s1 ">
    
    <h1 class="h1 display" style="animation:rise 0.8s 0.3s both">Your pet's day, <span class='acc'>on your home screen.</span></h1>
    <p class="sub" style="animation:rise 0.6s 2.4s both">No app opening needed.</p>
  </section>
  <section class="scene s2 ">
    <h2 class="h2 display" style="font-size:96px;margin-bottom:44px;animation:rise 0.6s 5.9s both">The whole day, <span class="acc">one glance.</span></h2>
    <div class="frame" style="width:900px;height:937px;align-self:center;animation:pop 0.7s 7.0s both"><img src="../brand/assets/widget.png" alt="PETTO home screen widget" style="position:absolute;width:1044px;left:-71px;top:-326px"></div>
  </section>
  <section class="scene s3 ">
    <h2 class="h2 display" style="animation:rise 0.6s 21.3s both">Tick it off. <span class='acc'>Done.</span></h2>
    <div class="card" style="animation:rise 0.6s 22.3s both, pulse 1.6s 23.5s 2"><img src="../brand/logo.png" alt="PETTO logo"><div><b>PETTO · 6:30 PM</b><span>Dinner for Charlotte.</span></div></div>
    <div class="check" style="animation:pop 0.5s 24.3s both"><svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  </section>
  <section class="scene s4 end">
    <img src="../brand/logo.png" alt="PETTO logo" style="animation:pop 0.6s 26.3s both">
    <span class="wordmark" style="animation:rise 0.5s 26.8s both">PETTO</span>
    <h3 style="animation:rise 0.5s 27.2s both">Know what your pet needs today.</h3>
    <span class="cta" style="animation:pop 0.5s 27.8s both">Free on iOS &amp; Android</span>
  </section>
</div>
</body>
</html>
