<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../brand/brand.css">
<title>Feature: vet records in one place</title>
<style>
.stage{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--navy);font-family:"DM Sans",sans-serif;color:#fff}
.scene{position:absolute;inset:0;padding:200px 110px 420px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:40px;opacity:0}
.dark{background:var(--navy);color:#fff}.light{background:var(--cream);color:var(--navy)}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes hide{from{opacity:1}to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
h1,h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.03em;line-height:.98;margin:0}
h1{font-size:128px}h2{font-size:100px}
.dark h1 span,.dark h2 span{color:var(--peach)}.light h1 span,.light h2 span{color:var(--clay)}
.sub{font-size:46px;line-height:1.25;margin:0}.dark .sub{color:#C9D1DC}.light .sub{color:var(--slate)}
.paw{width:170px;height:170px}
.msg{align-self:flex-start;max-width:800px;padding:30px 38px;border-radius:40px 40px 40px 12px;font-size:48px;line-height:1.25}
.dark .msg{background:rgba(255,255,255,.1)}.light .msg{background:var(--blush)}
.msg i{display:block;font-style:normal;font-size:30px;margin-top:8px;opacity:.65}
.head{display:flex;align-items:center;gap:22px;margin-bottom:10px}
.head .av{width:96px;height:96px;border-radius:50%;background:var(--blush);display:flex;align-items:center;justify-content:center}
.head b{font-size:46px}.head small{display:block;font-size:30px;opacity:.65}
.stars{display:flex;gap:10px}.stars .on{fill:var(--peach);stroke:var(--peach)}.stars .off{fill:none;stroke:#7C879A}
.item{display:flex;align-items:center;gap:34px;padding:36px 40px;border-radius:36px;font-size:48px;line-height:1.2;font-weight:500}
.light .item{background:#fff;box-shadow:0 20px 50px rgba(30,42,59,.10)}.dark .item{background:rgba(255,255,255,.1)}
.num{flex:none;width:92px;height:92px;border-radius:50%;background:var(--clay);color:#fff;font-family:"Bricolage Grotesque";font-weight:800;font-size:54px;display:flex;align-items:center;justify-content:center}
.dark .num{background:var(--peach);color:var(--navy)}
.card{display:flex;align-items:center;gap:30px;padding:40px;border-radius:44px;background:var(--clay);color:#fff;box-shadow:0 40px 80px rgba(0,0,0,.30)}
.card img{width:110px;height:110px;border-radius:26px;flex:none}.card b{font-size:40px;display:block}.card span{font-size:44px;line-height:1.2}
.check{align-self:center;width:130px;height:130px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center}
.phone{align-self:center;width:520px;height:800px;border-radius:64px;border:14px solid var(--navy);overflow:hidden;box-shadow:0 40px 80px rgba(30,42,59,.25);background:#fff}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.chip{align-self:flex-start;padding:22px 40px;border-radius:999px;background:var(--blush);color:var(--clay-dark);font-size:44px;font-weight:700}
.dark .chip{background:rgba(240,169,140,.18);color:var(--peach)}
.end{align-items:center;text-align:center;gap:44px;background:var(--cream);color:var(--navy)}
.end img{width:220px;height:220px;border-radius:52px}
.end .wordmark{font-family:"Bricolage Grotesque";font-weight:800;font-size:72px;letter-spacing:.06em;color:var(--clay)}
.end h3{font-family:"Bricolage Grotesque";font-weight:800;font-size:84px;line-height:1;margin:0;letter-spacing:-.02em}
.end .cta{font-size:46px;padding:30px 56px;background:var(--clay);color:#fff;border-radius:999px;font-weight:700}
</style>
</head>
<body>
<div class="stage">
<section class="scene light" style="animation:show 0s 0s both, hide .5s 5.5s forwards"><h1 style="animation:rise 0.8s 0.3s both">The vet asks: <span>last vaccine?</span></h1><p class="sub" style="animation:rise 0.6s 2.4s both">You, sweating.</p></section>
<section class="scene light" style="animation:show 0.5s 5.5s both, hide .5s 16.5s forwards"><h2 style="animation:rise 0.6s 6s both">Everything in <span>one place.</span></h2><div class="phone" style="animation:rise 0.7s 7s both"><img src="../brand/assets/healt-records-sreen.png" alt="PETTO app screen"></div></section>
<section class="scene light" style="animation:show 0.5s 16.5s both, hide .5s 26s forwards"><h2 style="animation:rise 0.6s 16.8s both">Calm <span>vet visits.</span></h2><div class="item" style="animation:pop 0.5s 17.8s both"><span>Upcoming boosters</span></div><div class="item" style="animation:pop 0.5s 20.3s both"><span>Allergies and notes</span></div><div class="item" style="animation:pop 0.5s 22.8s both"><span>Every visit</span></div></section>
<section class="scene end" style="animation:show 0.5s 26s both"><img src="../brand/logo.png" alt="PETTO logo" style="animation:pop 0.6s 26.3s both"><span class="wordmark" style="animation:rise 0.5s 26.8s both">PETTO</span><h3 style="animation:rise 0.5s 27.2s both">Vet records, sorted.</h3><span class="cta" style="animation:pop 0.5s 27.8s both">Free on iOS &amp; Android</span></section>
</div>
</body>
</html>
