name: Post to Instagram

on:
  schedule:
    - cron: "7 9 * * *"
    - cron: "7 13 * * *"
    - cron: "7 17 * * *"
    - cron: "7 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Publish next post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          git config user.name "petto-bot"
          git config user.email "petto-bot@users.noreply.github.com"
          python post.py
